
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: EAS preview APK
    runs-on: ubuntu-latest

    env:
      EXPO_PUBLIC_API_URL: ${{ vars.MENDYR_API_URL || 'https://mendyr-backend-v1.fastapicloud.dev' }}

    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build APK with Expo token fallback
        shell: bash
        env:
          EXPO_TOKEN_1: ${{ secrets.EXPO_TOKEN }}
          EXPO_TOKEN_2: ${{ secrets.EXPO_TOKEN_2 }}
          EXPO_TOKEN_3: ${{ secrets.EXPO_TOKEN_3 }}
        run: |
          set +e

          for attempt in 1 2 3; do
            token_var="EXPO_TOKEN_${attempt}"
            token="${!token_var}"

            if [ -z "$token" ]; then
              echo "Token $attempt is missing; skipping."
              continue
            fi

            echo "Starting Android build attempt $attempt of 3."

            export EXPO_TOKEN="$token"

            npx eas-cli@latest build \
              --platform android \
              --profile preview \
              --non-interactive \
              --wait

            status=$?

            if [ "$status" -eq 0 ]; then
              echo "Android APK build succeeded."
              exit 0
            fi

            echo "Build attempt $attempt failed with exit code $status."

            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done

          echo "All three token attempts failed."
          exit 1
